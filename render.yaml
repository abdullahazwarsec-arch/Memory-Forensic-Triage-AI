services:
  - type: web
    name: hazmem-memory-forensics
    runtime: python
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.fileWatcherType none
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HAZMEM_ADMIN_USER
        value: admin
      - key: HAZMEM_ADMIN_PASSWORD
        value: Str0ngPassw0rd
      - key: HAZMEM_RESET_ADMIN
        value: "1"
      - key: HAZMEM_DEMO_USER
        value: viewer
      - key: HAZMEM_DEMO_PASSWORD
        value: HazMem2026Demo
      - key: FORENSICS_LEDGER_KEY
        value: 21d4b52bee254e8c17a188e79cb8ff7f07ee07b76d5837fff8bb515b1af2ecd5

