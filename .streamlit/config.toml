[server]
# Serve only on this machine. Evidence and the local-path input must not be
# reachable from the network (Streamlit otherwise listens on all interfaces).
address = "localhost"

# Allow raw memory dumps to be uploaded (size in MB). Larger dumps can be
# analysed by entering their local path instead of uploading.
maxUploadSize = 8192

[client]
# Hide the "Deploy" button and developer menu items
toolbarMode = "minimal"

[theme]
# "Emerald Forensics" theme (matches ui_theme.py tokens)
base = "dark"
primaryColor = "#10b981"
backgroundColor = "#070d0b"
secondaryBackgroundColor = "#0f1a16"
textColor = "#e3f2ec"
borderColor = "#1f332c"
linkColor = "#34d399"
codeBackgroundColor = "#0b1512"
dataframeHeaderBackgroundColor = "#0f1a16"
showSidebarBorder = true
baseFontSize = 17
baseRadius = "12px"
buttonRadius = "full"
headingFontWeights = [800, 800, 700, 700, 700, 700]
font = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
