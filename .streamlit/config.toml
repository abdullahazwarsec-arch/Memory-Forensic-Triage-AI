[server]
# Serve only on this machine. Evidence and the local-path input must not be
# reachable from the network (Streamlit otherwise listens on all interfaces).
address = "localhost"

# Allow raw memory dumps to be uploaded (size in MB). Larger dumps can be
# analysed by entering their local path instead of uploading.
maxUploadSize = 8192

[client]
# Hide the "Deploy" button and developer menu items
toolbarMode = "minimal"

[theme]
# "Royal Purple" - shared settings; colours per mode below (match hazmem/ui_theme.py tokens).
# Users switch Light / Dark / Auto in the dashboard sidebar (hazmem/assets/theme.js).
baseFontSize = 16
baseRadius = "14px"
buttonRadius = "full"
showSidebarBorder = true
headingFontWeights = [700, 700, 600, 600, 600, 600]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Poppins:https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"

[theme.dark]
primaryColor = "#8b5cf6"
backgroundColor = "#100b1f"
secondaryBackgroundColor = "#1a1330"
textColor = "#eeeafb"
borderColor = "#34295a"
linkColor = "#c4b5fd"
codeBackgroundColor = "#150f29"
dataframeHeaderBackgroundColor = "#1a1330"

[theme.light]
primaryColor = "#7c3aed"
backgroundColor = "#f8f6ff"
secondaryBackgroundColor = "#f1ecff"
textColor = "#1e1537"
borderColor = "#dcd2f7"
linkColor = "#6d28d9"
codeBackgroundColor = "#f1ecff"
dataframeHeaderBackgroundColor = "#f1ecff"
